<script>
/* ===== verified data (reused verbatim from the Cancer Staging Hub) ===== */
const T1any = ["T1","T1a","T1b"];
const ESO = {

    {stage:"IVA", N:["N3"], M:["M0"], cite:"pSCC: any T N3"},

    {stage:"IIB", T:["T3"], N:["N0"], location:["upper","middle"], grade:["G2","G3"], M:["M0"], cite:"pSCC Fig4B: T3N0 U/M G2–3"},

  ],

    {stage:"IIB", T:["T3"], N:["N0"], M:["M0"], cite:"pEAC: T3 N0"},
    {stage:"IIB", T:[...T1any], N:["N1"], M:["M0"], cite:"pEAC: T1 N1"},

    {stage:"IB", T:["T1a"], N:["N0"], grade:["G2"], M:["M0"], cite:"pEAC: T1a N0 G2"},
    {stage:"IA", T:["T1a"], N:["N0"], grade:["G1"], M:["M0"], cite:"pEAC: T1a N0 G1"}
  ]
};
const THY = {
  source: "AJCC Cancer Staging Manual, 8th Edition — Differentiated Thyroid Carcinoma (papillary/follicular)",
  url: "https://link.springer.com/article/10.1245/s10434-019-07490-w", verified: true,
  rows: [
    {stage:"II", age:["under55"], M:["M1"], cite:"DTC <55: any T, any N, M1"},
    {stage:"I", age:["under55"], M:["M0"], cite:"DTC <55: any T, any N, M0"},
    {stage:"IVB", age:["over55"], M:["M1"], cite:"DTC ≥55: any T/N, M1"},
    {stage:"IVA", age:["over55"], T:["T4b"], M:["M0"], cite:"DTC ≥55: T4b, any N"},
    {stage:"III", age:["over55"], T:["T4a"], M:["M0"], cite:"DTC ≥55: T4a, any N"},
    {stage:"II", age:["over55"], T:["T3","T3a","T3b"], M:["M0"], cite:"DTC ≥55: T3a/T3b, any N"},
    {stage:"II", age:["over55"], T:["T1","T1a","T1b","T2"], N:["N1","N1a","N1b"], M:["M0"], cite:"DTC ≥55: T1–2, N1"},
    {stage:"I", age:["over55"], T:["T1","T1a","T1b","T2"], N:["N0","NX"], M:["M0"], cite:"DTC ≥55: T1–2, N0/NX"}
  ]
};
/* ===== resolver (verbatim) ===== */
const RESERVED_ROW_KEYS = new Set(["stage","cite","src","locus"]);
function resolveGroup(rows, ctx){
  return rows.find(row => Object.keys(row).every(k => {
    if (RESERVED_ROW_KEYS.has(k)) return true;
    const val = ctx[k.toLowerCase()];
    return Array.isArray(row[k]) ? row[k].includes(val) : row[k] === val;
  })) || null;
}
const ESO_SUBSTAGES = { T1:["T1a","T1b"], T4:["T4a","T4b"] };
function resolveWithSubstages(rows, ctx, subMap){
  const direct = resolveGroup(rows, ctx); if (direct) return direct;
  const subs = subMap[ctx.t];
  if (subs){ const hits = subs.map(t => resolveGroup(rows, {...ctx, t}));
    if (hits.every(h => h) && hits.every(h => h.stage === hits[0].stage)) return {...hits[0], cite: hits[0].cite + " (substages agree)"}; }
  return null;
}
const resolveEsoGroup = (rows, ctx) => resolveWithSubstages(rows, ctx, ESO_SUBSTAGES);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== T/N/M definitions (from the hub modules) ===== */
const ESO_T={T0:"No evidence of primary tumor (e.g. complete response after neoadjuvant therapy).",Tis:"High-grade dysplasia (confined to basement membrane).",T1:"Invades lamina propria, muscularis mucosae, or submucosa.",T1a:"Invades lamina propria or muscularis mucosae.",T1b:"Invades the submucosa.",T2:"Invades the muscularis propria.",T3:"Invades the adventitia.",T4:"Invades adjacent structures.",T4a:"Resectable: pleura, pericardium, or diaphragm.",T4b:"Unresectable: aorta, trachea, etc."};
const ESO_N={N0:"No regional lymph node metastasis.",N1:"1–2 regional nodes.",N2:"3–6 regional nodes.",N3:"≥7 regional nodes."};
const ESO_M={M0:"No distant metastasis.",M1:"Distant metastasis."};
const THY_T={T1:"≤2 cm, limited to thyroid.",T1a:"≤1 cm, limited to thyroid.",T1b:">1–2 cm, limited to thyroid.",T2:">2–4 cm, limited to thyroid.",T3:">4 cm limited, or gross ETE to strap muscles.",T3a:">4 cm, limited to thyroid.",T3b:"Gross ETE invading strap muscles.",T4:"Advanced (T4a/T4b).",T4a:"Gross ETE: subcut, larynx, trachea, esophagus, or RLN.",T4b:"Gross ETE: prevertebral fascia, carotid, or mediastinal vessels."};
const THY_N={N0:"No regional node metastasis.",N1:"Regional node metastasis.",N1a:"Level VI/VII (central).",N1b:"Lateral cervical (I–V) or retropharyngeal."};

/* ===== field configs ===== */
const CFG={
  eso:{title:"食道癌 Esophageal", note:"AJCC 8th · 依組織型(SCC/EAC)與分期情境(c/p/yp)分流；pTNM SCC 另受 grade 與部位影響。",
    fields:[

      {k:"Histology",label:"組織型 Histology",opts:[["squamous","Squamous cell (ESCC)"],["adenocarcinoma","Adenocarcinoma (EAC)"]]},

      {k:"T",label:"T category",opts:Object.keys(THY_T).map(c=>[c,c])},

    ], Tdef:THY_T,Ndef:THY_N,Mdef:THY_M, source:THY.source, url:THY.url}

/* ===== stagers (logic reused) ===== */
function stageEso(v){
  const {StagingMode:mode,Histology:histology,Grade:grade,Location:location,T:t,N:n,M:m}=v;
  const cards=[]; const histLabel=histology==="adenocarcinoma"?"Adenocarcinoma (EAC)":"Squamous cell (ESCC)";
  let nccn;
  if(m==="M1"){ nccn=histology==="adenocarcinoma"
    ?"<b>Advanced EAC</b>: doublet chemo + immunotherapy (pembrolizumab/nivolumab) if PD-L1 CPS ≥5. Check HER2 (trastuzumab) & CLDN18.2 (zolbetuximab)."
    :"<b>Advanced ESCC</b>: doublet chemo + immunotherapy, or chemo-free dual checkpoint (nivolumab + ipilimumab; NCCN Cat 1, CheckMate 648)."; }
  else if(histology==="adenocarcinoma"){ nccn="<b>Localized EAC</b>: perioperative FLOT ± immunotherapy preferred; preop CRT (CROSS) + surgery acceptable."; }
  else if(location==="upper"&&mode!=="ypTNM"){ nccn="<b>Upper/cervical ESCC</b>: organ preservation — definitive chemoradiotherapy without surgery."; }
  else { nccn="<b>Localized ESCC</b>: preop chemoradiation then surgery is standard; definitive CRT a viable alternative."; }
  const gradeShown=mode==="pTNM"?grade:"not used in cTNM/ypTNM";
  const locText=(histology==="squamous"&&mode==="pTNM")?` · location ${cap(location)}`:"";
  cards.push({accent:"amber",title:`Subtype & mode · ${mode}`,html:`<b>${histLabel}</b> · grade <b>${gradeShown}</b>${locText}. SCC and adeno follow distinct pTNM cohorts.<div class="nccn"><span class="nccn-h">NCCN treatment pathway</span>${nccn}</div>`});
  let rows,tableName;
  if(mode==="ypTNM"){rows=ESO.ypTNM;tableName="ypTNM (postneoadjuvant, unified)";}
  else if(mode==="cTNM"){rows=histology==="squamous"?ESO.cTNM_SCC:ESO.cTNM_EAC;tableName=`cTNM (${histology==="squamous"?"SCC":"adeno"})`;}
  else{rows=histology==="squamous"?ESO.pTNM_SCC:ESO.pTNM_EAC;tableName=`pTNM (${histology==="squamous"?"SCC":"adeno"})`;}
  const row=resolveEsoGroup(rows,{t,n,m,grade,location});
  return {stage: row?("Stage "+row.stage):"Stage —", cite:row?row.cite:null, tableName, cards,
    detail: row?null:"這組 T/N/M(±grade/部位)無法對到單一分期組——請補齊 substage 或對照 AJCC 正本。"};
}
function stageThy(v){
  const {Age:age,T:t,N:n,M:m}=v;
  const cards=[{accent:"accent",title:"Age-based staging",html:`Age <b>${age==="under55"?"< 55":"≥ 55"}</b>. 分化型甲狀腺癌 <55 歲最高只到 Stage II（即使 M1）。`}];
  const row=resolveGroup(THY.rows,{age,t,n,m});
  return {stage: row?("Stage "+row.stage):"Stage —", cite:row?row.cite:null, tableName:"DTC stage groups (age-stratified)", cards,
    detail: row?null:"這組輸入無法對到單一 DTC 分期組（如泛用 T4，T4a/T4b 分期不同）——請指定 substage。"};
}

/* ===== UI ===== */
let CUR="eso"; const state={eso:{},thy:{}};
function sev(stage){ if(!stage||stage.includes("—"))return"none"; if(/IV/.test(stage))return"high"; if(/III/.test(stage))return"high"; if(/(Stage|Grade) ?II/.test(stage))return"mid"; return"low"; }
function fs(d){ const el=document.documentElement; let v=parseFloat(getComputedStyle(el).getPropertyValue('--fs'))||17; v=Math.max(14,Math.min(22,v+d)); el.style.setProperty('--fs',v+'px'); }
function show(which){ CUR=which; document.getElementById('tab-eso').classList.toggle('on',which==="eso"); document.getElementById('tab-thy').classList.toggle('on',which==="thy"); renderForm(); render(); }
function renderForm(){
  const c=CFG[CUR]; document.getElementById('fTitle').textContent=c.title; document.getElementById('fNote').textContent=c.note;
  const st=state[CUR];
  document.getElementById('form').innerHTML=c.fields.map(f=>{
    if(!(f.k in st)) st[f.k]=f.opts[0][0];
    return `<div class="fld"><label>${esc(f.label)}</label><select data-k="${f.k}">`+
      f.opts.map(o=>`<option value="${o[0]}" ${st[f.k]===o[0]?"selected":""}>${esc(o[1])}</option>`).join("")+`</select></div>`;
  }).join("");
  document.querySelectorAll('#form select').forEach(s=>s.addEventListener('change',e=>{ st[e.target.dataset.k]=e.target.value; render(); }));
}
function render(){
  const c=CFG[CUR], v=state[CUR];
  const res = CUR==="eso"?stageEso(v):stageThy(v);
  const s=res.stage, sc=sev(s);
  const defRow=(code,def)=>code&&def[code]?`<div class="dr"><div class="dc">${esc(code)}</div><div>${esc(def[code])}</div></div>`:"";
  let html=`<div class="badge sev-${sc}"><span class="stg">${esc(s)}</span>`+
    (res.cite?`<span class="via">← ${esc(res.cite)}</span>`:(res.detail?`<span class="via">${esc(res.detail)}</span>`:""))+`</div>`;
  html+=res.cards.map(cd=>`<div class="acard ${cd.accent==='amber'?'amber':cd.accent==='green'?'green':''}"><span class="t">${esc(cd.title)}</span>${cd.html}</div>`).join("");
  html+=`<div class="defs"><div style="font-weight:800;color:var(--head);font-size:.9rem">Selected criteria</div>`+
    defRow(v.T,c.Tdef)+defRow(v.N,c.Ndef)+defRow(v.M,c.Mdef)+`</div>`;
  html+=`<div class="prov"><span class="vchip">✓ VERIFIED</span> Source: <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.source)}</a>`+
    (res.tableName?` · Table: <b>${esc(res.tableName)}</b>`:"")+`. Decision support — confirm against AJCC before clinical use.</div>`;
  document.getElementById('result').innerHTML=html;
}
document.getElementById('foot').textContent="沿用 Cancer Staging Hub 已 verified 規則資料 · 單檔離線可用 · "+new Date().getFullYear();
renderForm(); render();
</script>
</body></html>
